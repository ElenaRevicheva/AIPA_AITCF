# Promo images for Make.com / Buffer.
# EspaLuz_Influencer GitHub is private, so raw.githubusercontent.com 404s.
# Public base: https://webhook.aideazz.xyz/influencer-images/<path>
#
# Install: paste into the HTTPS server{} of /etc/nginx/sites-available/webhook
# ABOVE `location / {`. Then: sudo nginx -t && sudo systemctl reload nginx

    location ^~ /influencer-images/youtube/ {
        alias /var/www/influencer-images/youtube/;
        autoindex off;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        types {
            video/mp4 mp4;
            image/jpeg jpg jpeg;
            text/html html;
        }
        default_type video/mp4;
    }

    location /influencer-images/ {
        alias /var/www/influencer-images/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            video/mp4 mp4;
        }
    }
