# /etc/logrotate.d/aideazz-app-logs — 9 Oct 2026 (docs/oracle/ORACLE_DISK_FORENSICS_2026-10-09.md)
# App logs that nothing rotated: the health check's own log (212 MB, mostly May noise), the EspaLuz family bot (145 MB), the
# cron job logs in ~/logs. copytruncate = the writing program keeps its file handle; old content is compressed, not lost.
# Installed by scripts/oracle-resilience/disk-prevention-apply.sh; the stock logrotate.timer runs it daily at 00:00 UTC.

/var/log/oracle-health.log /var/log/espaluz-familybot.log /var/log/joblist-pipeline.log /var/log/oci-keepalive.log {
    su ubuntu ubuntu
    size 20M
    rotate 4
    compress
    copytruncate
    missingok
    notifempty
}

# The old duplicate espaluz-webhook.service wrote here (crash loop, disabled 9 Oct). Kept rotated in case it is ever re-enabled.
/var/log/espaluz-webhook.log {
    su root root
    size 20M
    rotate 2
    compress
    copytruncate
    missingok
    notifempty
}

/home/ubuntu/logs/*.log {
    su ubuntu ubuntu
    size 10M
    rotate 4
    compress
    copytruncate
    missingok
    notifempty
}
