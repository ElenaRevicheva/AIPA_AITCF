# Reference: the /doc/ location from /etc/nginx/sites-available/webhook on Oracle.
# Serves hosted, extensionless, noindex documents from /var/www/aideazz-docs/.
# Public base URL: https://webhook.aideazz.xyz/doc/<name>   (e.g. /doc/nine-systems)
#
# Why this file exists: this block previously lived ONLY on the VM. The URL it
# serves is inside outreach already sent to prospects, so losing the VM would
# 404 a live link. Untracked infrastructure = production config that exists only
# as long as one disk does.
#
# Install:
#   sudo cp /etc/nginx/sites-available/webhook /etc/nginx/sites-available/webhook.bak.$(date +%Y%m%d-%H%M%S)
#   # paste the two location blocks below into the server{} block, ABOVE `location / {`
#   sudo nginx -t && sudo systemctl reload nginx
#
# Restore:
#   sudo cp /etc/nginx/sites-available/webhook.bak.* /etc/nginx/sites-available/webhook
#   sudo nginx -t && sudo systemctl reload nginx

    # 301 from the original unlisted slug to the short URL.
    # __DOC_SLUG__ is the real filename slug; it is NOT committed (this repo is
    # public). Live value: docs/strategy/.deploy-token (gitignored), and the file
    # itself on the VM at /var/www/aideazz-docs/nine-systems-__DOC_SLUG__.html
    location = /doc/nine-systems-__DOC_SLUG__.html {
        return 301 https://webhook.aideazz.xyz/doc/nine-systems;
    }

    location /doc/ {
        alias /var/www/aideazz-docs/;
        autoindex off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri.html =404;
    }
