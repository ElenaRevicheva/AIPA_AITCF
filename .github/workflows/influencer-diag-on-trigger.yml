# Diagnose EspaLuz Influencer → Make.com from Oracle.
# Cloud agents cannot SSH and cannot clone EspaLuz_Influencer (private, out of
# this token's scope). This trigger SSHes, prints a redacted diagnosis to the
# log (the only channel the agent can read), and never prints secrets.
#
# Usage:
#   echo "diag" > .influencer-diag-trigger
#   git add .influencer-diag-trigger && git commit -m "diag: influencer make webhook" && git push
#   echo "# idle" > .influencer-diag-trigger

name: Influencer Make.com diagnosis (trigger file)

on:
  push:
    branches: [main, "cursor/**"]
    paths: [".influencer-diag-trigger"]

jobs:
  influencer-diag:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Parse .influencer-diag-trigger
        id: trigger
        run: |
          set -euo pipefail
          LINE=$(head -n1 .influencer-diag-trigger | tr -d '\r' | xargs || true)
          [ -n "$LINE" ] || { echo "::error::.influencer-diag-trigger is empty"; exit 1; }
          case "$LINE" in
            \#*|none|idle) echo "Trigger idle — skip."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            diag|fix|sync|cmo|cmo-fix|geo|fire|api-film|api-film-bust) echo "skip=false" >> "$GITHUB_OUTPUT"; echo "mode=$LINE" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::first token must be diag, fix, sync, cmo, cmo-fix, geo, fire, api-film, api-film-bust, or # idle — got '$LINE'"; exit 1 ;;
          esac

      - name: Require ORACLE_SSH_KEY
        if: steps.trigger.outputs.skip != 'true'
        run: |
          if [ -z "${{ secrets.ORACLE_SSH_KEY }}" ]; then
            echo "::error::Add ORACLE_SSH_KEY — see scripts/oracle-resilience/CLOUD_AGENT_DEPLOY.md"
            exit 1
          fi

      - name: Diagnose or fix on Oracle
        if: steps.trigger.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          MODE: ${{ steps.trigger.outputs.mode }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          # Short SSH sessions. v12 died on a 4-min xfade silence (Broken pipe);
          # the retry then timed out on the banner. Retry connects; compile is detached.
          SSHOPTS="-i $HOME/.ssh/oracle -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=40 -o ServerAliveInterval=20 -o ServerAliveCountMax=6"
          ssh_retry() {
            n=0
            while [ "$n" -lt 6 ]; do
              n=$((n + 1))
              echo "ssh_retry $n: $*"
              if ssh $SSHOPTS ubuntu@170.9.242.90 "$@"; then
                return 0
              fi
              echo "ssh_retry $n failed"
              sleep $((n * 8))
            done
            return 1
          }
          scp_retry() {
            n=0
            while [ "$n" -lt 6 ]; do
              n=$((n + 1))
              echo "scp_retry $n"
              if scp $SSHOPTS "$@"; then
                return 0
              fi
              echo "scp_retry $n failed"
              sleep $((n * 8))
            done
            return 1
          }
          if [ "$MODE" = "fix" ]; then
            scp $SSHOPTS \
              scripts/oracle-resilience/patch-influencer-make-images.py \
              ubuntu@170.9.242.90:/tmp/patch-influencer-make-images.py
            ssh $SSHOPTS ubuntu@170.9.242.90 'bash -s' -- \
              "$MODE" < scripts/oracle-resilience/fix-influencer-make-images.sh
          elif [ "$MODE" = "sync" ]; then
            ssh $SSHOPTS ubuntu@170.9.242.90 'bash -s' -- \
              "$MODE" < scripts/oracle-resilience/sync-influencer-git.sh
          elif [ "$MODE" = "cmo-fix" ]; then
            scp $SSHOPTS \
              scripts/oracle-resilience/patch-cmo-make-images.py \
              ubuntu@170.9.242.90:/tmp/patch-cmo-make-images.py
            ssh $SSHOPTS ubuntu@170.9.242.90 'bash -s' -- \
              "$MODE" < scripts/oracle-resilience/fix-cmo-make-images.sh
          elif [ "$MODE" = "geo" ]; then
            scp $SSHOPTS \
              scripts/oracle-resilience/patch-influencer-geo-rotation.py \
              scripts/oracle-resilience/geo_api_promo.py \
              ubuntu@170.9.242.90:/tmp/
            scp -r $SSHOPTS \
              scripts/oracle-resilience/geo-api-assets \
              ubuntu@170.9.242.90:/tmp/geo-api-assets
            ssh $SSHOPTS ubuntu@170.9.242.90 'bash -s' -- \
              "$MODE" < scripts/oracle-resilience/fix-influencer-geo.sh
          elif [ "$MODE" = "fire" ]; then
            scp $SSHOPTS \
              scripts/oracle-resilience/geo_api_promo.py \
              scripts/oracle-resilience/patch-influencer-geo-rotation.py \
              ubuntu@170.9.242.90:/tmp/
            ssh $SSHOPTS ubuntu@170.9.242.90 'bash -s' -- \
              "$MODE" < scripts/oracle-resilience/fire-influencer-promo.sh
          elif [ "$MODE" = "api-film-bust" ]; then
            scp $SSHOPTS \
              scripts/oracle-resilience/api-film-watch.html \
              ubuntu@170.9.242.90:/tmp/api-film-watch.html
            ssh $SSHOPTS ubuntu@170.9.242.90 'bash -s' -- \
              "$MODE" < scripts/oracle-resilience/bust-api-audit-film.sh
          elif [ "$MODE" = "api-film" ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
            bash scripts/oracle-resilience/compile-api-film-runner.sh
            RC=$?
          else
            ssh $SSHOPTS ubuntu@170.9.242.90 'bash -s' -- \
              "$MODE" < scripts/oracle-resilience/diag-influencer-promo.sh
          fi
          STEP_RC=$?
          : "${RC:=$STEP_RC}"
          echo "--- remote exit code: $RC ---"
          rm -f ~/.ssh/oracle
          exit $RC

      - name: Upload /api film
        if: steps.trigger.outputs.skip != 'true' && steps.trigger.outputs.mode == 'api-film'
        uses: actions/upload-artifact@v4
        with:
          name: api-film-v12
          path: |
            ${{ runner.temp }}/aideazz-api-film/out/can-ai-find-and-cite-you-v12.mp4
            ${{ runner.temp }}/aideazz-api-film/out/watch.html
            ${{ runner.temp }}/aideazz-api-film/out/can-ai-find-and-cite-you-poster.jpg
            ${{ runner.temp }}/aideazz-api-film/out/api-cta-qr.png
            ${{ runner.temp }}/aideazz-api-film/frames/
          if-no-files-found: error

      - name: Publish /api film to Oracle
        if: steps.trigger.outputs.skip != 'true' && steps.trigger.outputs.mode == 'api-film'
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -uo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          SSHOPTS="-i $HOME/.ssh/oracle -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=40 -o ServerAliveInterval=20 -o ServerAliveCountMax=6"
          OUT="${RUNNER_TEMP}/aideazz-api-film/out"
          n=0
          while [ "$n" -lt 8 ]; do
            n=$((n + 1))
            echo "publish ssh attempt $n"
            sleep $(( n == 1 ? 20 : n * 10 ))
            if ssh $SSHOPTS ubuntu@170.9.242.90 'mkdir -p /tmp/api-film-out && rm -f /tmp/api-film-out/*'; then
              scp $SSHOPTS \
                "$OUT/can-ai-find-and-cite-you-v12.mp4" \
                "$OUT/can-ai-find-and-cite-you.mp4" \
                "$OUT/can-ai-find-and-cite-you-poster.jpg" \
                "$OUT/api-cta-qr.png" \
                "$OUT/api-cta-endcard.png" \
                "$OUT/watch.html" \
                ubuntu@170.9.242.90:/tmp/api-film-out/ \
                && ssh $SSHOPTS ubuntu@170.9.242.90 'bash -s' \
                  < scripts/oracle-resilience/publish-api-film.sh
              PRC=$?
              echo "publish rc=$PRC"
              rm -f ~/.ssh/oracle
              exit "$PRC"
            fi
            echo "publish ssh attempt $n failed"
          done
          rm -f ~/.ssh/oracle
          echo "WARN: Oracle SSH still down — film is in the api-film-v12 artifact"
          exit 1
