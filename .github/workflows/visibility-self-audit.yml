# Audit our OWN properties with our own AEO/GEO/Tech-SEO engine.
# Cloud agents cannot workflow_dispatch (HTTP 403), so this uses the same
# trigger-file pattern as deploy-oracle-on-trigger.yml, plus a weekly schedule.
#
# Manual run (cloud agent or laptop):
#   date -u +%s > .audit-trigger && git add .audit-trigger && git commit -m "audit: self" && git push origin main
#
# cursor/** is included because a cloud agent VM has no egress to aideazz.xyz — the
# runner is the only place it can prove a live SEO/GEO claim, and it must be able to
# do that on the branch under review rather than after merging to main.

name: AIdeazz visibility self-audit

on:
  push:
    branches: [main, "cursor/**"]
    paths: [".audit-trigger"]
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC

jobs:
  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build engine
        run: npm ci && npx tsc
      - name: Dump live canonical HTML
        run: |
          set +e
          SLUG="55193-restarts-in-10-days-debugging-an-ai-agents-endless-loop"
          echo "=== GET today's article (trailing slash — IPFS directory) ==="
          curl -sS -D /tmp/art.hdr -o /tmp/art.html -A "AIdeazzVisibilityBot/1.0" \
            "https://aideazz.xyz/blog/${SLUG}/"
          echo "--- headers ---"
          cat /tmp/art.hdr
          echo "--- title ---"
          grep -oE '<title>[^<]*</title>' /tmp/art.html | head -1
          echo "--- first 1200 bytes ---"
          head -c 1200 /tmp/art.html; echo
          echo "=== GET pin stamp ==="
          curl -sS -D /tmp/stamp.hdr -o /tmp/stamp.txt -A "AIdeazzVisibilityBot/1.0" \
            "https://aideazz.xyz/4everland-pin-stamp.txt"
          echo "--- stamp headers ---"
          cat /tmp/stamp.hdr
          echo "--- stamp body ---"
          cat /tmp/stamp.txt; echo
          echo "=== /blog/ slug mention count ==="
          curl -sS -A "AIdeazzVisibilityBot/1.0" "https://aideazz.xyz/blog/" \
            | grep -c "$SLUG" || true
          echo "=== GET live wiki (prove 0007 is on the pin) ==="
          curl -sS -D /tmp/wiki.hdr -o /tmp/wiki.html -A "AIdeazzVisibilityBot/1.0" \
            "https://aideazz.xyz/ai-ops-wiki.html"
          echo "--- wiki headers ---"
          cat /tmp/wiki.hdr
          echo "--- wiki title ---"
          grep -oE '<title>[^<]*</title>' /tmp/wiki.html | head -1
          echo "--- wiki chapter present? ---"
          grep -c '2026-08-26-prompt-poisoned-the-grounding-gate' /tmp/wiki.html || true
          grep -c 'the-prompt-is-a-source' /tmp/wiki.html || true
      - name: Audit AIdeazz properties
        run: node scripts/visibility-self-audit.cjs
      # Prove today's canonical GEO URL is on the live IPFS pin, not only in git / Dev.to.
      # A missing public/blog/<slug> directory 404s with "no link named …" while those
      # other surfaces stay green. Trailing slash is required (IPFS directory).
      - name: Audit today's canonical post
        run: node scripts/visibility-self-audit.cjs https://aideazz.xyz/blog/55193-restarts-in-10-days-debugging-an-ai-agents-endless-loop/
      - name: Audit live wiki chapter
        run: node scripts/visibility-self-audit.cjs https://aideazz.xyz/ai-ops-wiki.html
