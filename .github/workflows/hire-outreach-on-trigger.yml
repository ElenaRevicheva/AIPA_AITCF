# Stage a hiring / [LICENSE] outreach deal into HubSpot, from a Cursor cloud agent.
#
# Credentials live on Oracle, not here: a cloud agent has no HUBSPOT_API_KEY and
# its egress allowlist excludes api.hubapi.com. Same trigger-file pattern as
# stage-prospect-on-trigger.yml, because agent tokens get HTTP 403 on
# workflow_dispatch.
#
# The workflow commits whatever the run wrote under docs/selling back to the
# triggering branch. /go/outreach-email/{slug} reads Oracle disk first, then
# GitHub main — so after a real run, copy the registry row onto main too or
# the GitHub fallback 404s.
#
# Usage:
#   echo "docs/selling/specs/fermatix.json" > .hire-trigger
#   git add .hire-trigger && git commit -m "stage: fermatix" && git push
#   echo "# idle" > .hire-trigger   # after a run, so a merge does not restage

name: Stage hiring / licence outreach (trigger file)

on:
  push:
    branches: [main, "cursor/**"]
    paths: [".hire-trigger"]

permissions:
  contents: write

jobs:
  stage-hiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Parse .hire-trigger
        id: trigger
        run: |
          set -euo pipefail
          LINE=$(head -n1 .hire-trigger | tr -d '\r' | xargs || true)
          [ -n "$LINE" ] || { echo "::error::.hire-trigger is empty"; exit 1; }

          case "$LINE" in
            \#*|none) echo "Trigger is idle ('$LINE') — nothing to stage."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          SPEC=$(echo "$LINE" | awk '{print $1}')
          # A spec path to stage a deal, or one of the named modes. All of them
          # need credentials that live only on Oracle, which is what this
          # bridge is for: close-send-tasks and attach-files write to HubSpot,
          # intelliops-mail reads the Zoho mailbox read-only.
          if [ "$SPEC" = "close-send-tasks" ] || [ "$SPEC" = "attach-files" ] || [ "$SPEC" = "intelliops-mail" ] || [ "$SPEC" = "espaluz-audio-logs" ]; then
            echo "Mode: $SPEC"
          elif echo "$SPEC" | grep -Eq '^docs/selling/specs/[a-z0-9-]+\.json$'; then
            [ -f "$SPEC" ] || { echo "::error::$SPEC is not in this commit"; exit 1; }
          else
            echo "::error::first token must be docs/selling/specs/<slug>.json, close-send-tasks, attach-files, intelliops-mail or espaluz-audio-logs — got '$SPEC'"
            exit 1
          fi

          FLAGS=$(echo "$LINE" | cut -s -d' ' -f2-)
          for f in $FLAGS; do
            case "$f" in
              # --attach-deal only fills dealId on an entry that already exists;
              # the script still refuses if that entry already points at a deal.
              # --deal=<digits>/--slug=<slug> scope a sweep or attach to one deal.
              --dry-run|--attach-deal|--all) ;;
              --deal=[0-9]*) ;;
              --slug=[a-z0-9-]*) ;;
              *) echo "::error::flag '$f' is not allowed"; exit 1 ;;
            esac
          done

          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "Staging '$SPEC' with flags: ${FLAGS:-<none>}"

      - name: Require ORACLE_SSH_KEY
        if: steps.trigger.outputs.skip != 'true'
        run: |
          if [ -z "${{ secrets.ORACLE_SSH_KEY }}" ]; then
            echo "::error::Add ORACLE_SSH_KEY — see scripts/oracle-resilience/CLOUD_AGENT_DEPLOY.md"
            exit 1
          fi

      - name: Run the play on Oracle
        if: steps.trigger.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          REF: ${{ github.ref_name }}
          SPEC: ${{ steps.trigger.outputs.spec }}
          FLAGS: ${{ steps.trigger.outputs.flags }}
        run: |
          set -uo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          SSHOPTS="-i $HOME/.ssh/oracle -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"

          # shellcheck disable=SC2086
          ssh $SSHOPTS ubuntu@170.9.242.90 'bash -s' -- \
            "$REF" "$SPEC" $FLAGS < scripts/oracle-stage-hiring-outreach.sh
          RC=$?
          echo "--- remote exit code: $RC ---"

          # shellcheck disable=SC2086
          scp $SSHOPTS ubuntu@170.9.242.90:/tmp/stage-hiring-output.tar.gz /tmp/ 2>/dev/null \
            && echo "--- pulled staging output ---" \
            || echo "--- no staging output to pull (dry run, or the run failed) ---"

          # intelliops-mail returns a bundle instead of registry changes.
          # shellcheck disable=SC2086
          scp $SSHOPTS ubuntu@170.9.242.90:/tmp/intelliops-mail.tar.gz /tmp/ 2>/dev/null \
            && echo "--- pulled mail bundle ---" || true

          rm -f ~/.ssh/oracle
          exit $RC

      # The mail bundle is how an agent with no mail credentials and no IMAP
      # egress reads the thread. Retention is ONE day on purpose: this is
      # Elena's private mailbox, and a build artifact should not become a
      # second copy of it. Private repo, so only collaborators can fetch it.
      - name: Upload mail bundle
        if: always() && steps.trigger.outputs.spec == 'intelliops-mail'
        uses: actions/upload-artifact@v4
        with:
          name: intelliops-mail
          path: /tmp/intelliops-mail.tar.gz
          retention-days: 1
          if-no-files-found: warn

      - name: Commit registry + drafts
        if: success() && steps.trigger.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ ! -f /tmp/stage-hiring-output.tar.gz ]; then
            echo "Nothing to commit — no files came back."; exit 0
          fi
          tar -xzf /tmp/stage-hiring-output.tar.gz -C .
          git add -A docs/selling
          if git diff --cached --quiet; then
            echo "Nothing to commit — docs/selling is unchanged."; exit 0
          fi
          git config user.name "aipa-staging[bot]"
          git config user.email "aipa@aideazz.xyz"
          git commit \
            -m "selling: stage ${{ steps.trigger.outputs.spec }} — registry + drafts" \
            -m "Committed from Oracle so /go/outreach-email/{slug} resolves the slug. Without this the email button 404s with 'Unknown outreach email slug'."
          git push origin HEAD:${{ github.ref_name }}
