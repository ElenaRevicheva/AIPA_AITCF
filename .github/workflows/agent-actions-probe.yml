# TEMPORARY probe — deleted in the next commit. Answers one question: does a push from
# this agent session create a workflow run at all? Touches nothing outside the runner.
name: Agent Actions probe

on:
  push:
    branches: [main, "cursor/**"]
    paths: [".actions-probe"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Actions is alive for ${{ github.ref_name }} at $(date -u)"
