# Auto-deploy on push of .deploy-trigger — lets Cursor Cloud Agents deploy without
# workflow_dispatch rights (agent tokens get HTTP 403 on the dispatches API).
# The trigger file's first line = product name (same choices as deploy-oracle.yml).
# Reuses the same SSH + deploy-product.sh path. See scripts/oracle-resilience/CLOUD_AGENT_DEPLOY.md
#
# Usage (cloud agent or laptop):
#   echo "cto_aipa" > .deploy-trigger && git add .deploy-trigger && git commit -m "deploy: cto_aipa" && git push origin main

name: Deploy to Oracle VM (trigger file)

on:
  push:
    branches:
      - main
      - cursor/atlas-classify-failed-1e36
    paths: [".deploy-trigger"]

jobs:
  deploy-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read product from trigger file
        id: trigger
        run: |
          PRODUCT=$(head -n1 .deploy-trigger | tr -d '[:space:]')
          SLUG=$(sed -n '2p' .deploy-trigger | tr -d '[:space:]')
          case "$PRODUCT" in
            whatsapp|telegram|influencer|dragontrade|vjh|vjh_web|openclaw|cto_aipa|atuona|atlas|fleet-verify|aideazz|blog_html|radar_buttons|atlas-diagnose|atlas-patch|atlas-encoding-sync|lead-machine-diagnose|lead-machine-run)
              echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
              echo "slug=$SLUG" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Invalid product '$PRODUCT' in .deploy-trigger"; exit 1 ;;
          esac

      - name: Require ORACLE_SSH_KEY
        run: |
          if [ -z "${{ secrets.ORACLE_SSH_KEY }}" ]; then
            echo "::error::Add ORACLE_SSH_KEY — see scripts/oracle-resilience/CLOUD_AGENT_DEPLOY.md"
            exit 1
          fi

      - name: Fleet deploy or verify via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 170.9.242.90
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -uo pipefail
            export PRODUCT="${{ steps.trigger.outputs.product }}"
            export BLOG_REPUBLISH_SLUG="${{ steps.trigger.outputs.slug }}"
            export DEPLOY_FILES=""
            export DISPATCH_NOTES="deploy-trigger file push (${{ github.sha }})"

            AIPA_DIR=/home/ubuntu/cto-aipa
            if [ ! -d "$AIPA_DIR/.git" ]; then AIPA_DIR=/home/ubuntu/AIPA_AITCF; fi
            cd "$AIPA_DIR"
            echo "--- deploy-trigger: $PRODUCT in $AIPA_DIR as $(whoami) ---"

            echo "--- git fetch origin main ---"
            git fetch origin main 2>&1 || { echo "FATAL: fetch rc=$?"; exit 1; }

            echo "--- refresh deploy scripts from origin/main ---"
            if ! git checkout origin/main -- scripts/ 2>&1; then
              echo "WARN: scripts/ checkout rc=$? — diagnosing:"
              git status --porcelain 2>&1 | head -20
              ls -la .git/index.lock 2>/dev/null && echo "WARN: stale index.lock present"
              echo "Continuing with the deploy scripts already on the box."
            fi

            chmod +x scripts/oracle-resilience/*.sh scripts/oracle-resilience/lib/*.sh 2>/dev/null || true
            chmod +x scripts/espaluz-hotfixes/*.sh 2>/dev/null || true

            echo "--- running deploy ---"
            if [ "$PRODUCT" = "fleet-verify" ]; then
              bash scripts/oracle-resilience/verify-fleet-health.sh 2>&1
            elif [ "$PRODUCT" = "aideazz" ]; then
              bash scripts/oracle-resilience/push-aideazz-patch.sh 2>&1
            elif [ "$PRODUCT" = "blog_html" ]; then
              bash scripts/oracle-resilience/republish-blog-html.sh 2>&1
            elif [ "$PRODUCT" = "radar_buttons" ]; then
              chmod +x scripts/oracle-radar-buttons.sh
              bash scripts/oracle-radar-buttons.sh 2>&1
            elif [ "$PRODUCT" = "atlas-diagnose" ]; then
              git fetch origin ${{ github.sha }}
              git checkout ${{ github.sha }} -- scripts/oracle-atlas-cron-diagnose.sh
              chmod +x scripts/oracle-atlas-cron-diagnose.sh
              bash scripts/oracle-atlas-cron-diagnose.sh 2>&1
            elif [ "$PRODUCT" = "atlas-patch" ]; then
              # Named-file checkout of THIS commit's patches (Oracle cto-aipa lags main).
              git fetch origin ${{ github.sha }}
              git checkout ${{ github.sha }} -- scripts/atlas-patches scripts/oracle-resilience/push-atlas-patch.sh scripts/oracle-resilience/lib/lf-normalize.py
              chmod +x scripts/oracle-resilience/push-atlas-patch.sh
              bash scripts/oracle-resilience/push-atlas-patch.sh 2>&1
            elif [ "$PRODUCT" = "atlas-encoding-sync" ]; then
              # Pin LF across git src, Oracle dist (gitignored), and the patch relay.
              # Does not re-run classify and does not restart whitespace.
              git fetch origin ${{ github.sha }}
              git checkout ${{ github.sha }} -- scripts/oracle-resilience/sync-atlas-encoding.sh scripts/oracle-resilience/lib/lf-normalize.py scripts/oracle-resilience/atlas-post-pull-dist.sh scripts/atlas-patches
              chmod +x scripts/oracle-resilience/sync-atlas-encoding.sh scripts/oracle-resilience/atlas-post-pull-dist.sh
              bash scripts/oracle-resilience/sync-atlas-encoding.sh 2>&1
            elif [ "$PRODUCT" = "lead-machine-diagnose" ]; then
              git fetch origin ${{ github.sha }}
              git checkout ${{ github.sha }} -- scripts/oracle-lead-machine-diagnose.sh
              chmod +x scripts/oracle-lead-machine-diagnose.sh
              bash scripts/oracle-lead-machine-diagnose.sh 2>&1
            elif [ "$PRODUCT" = "lead-machine-run" ]; then
              git fetch origin ${{ github.sha }}
              git checkout ${{ github.sha }} -- scripts/oracle-lead-machine-run.sh
              chmod +x scripts/oracle-lead-machine-run.sh
              bash scripts/oracle-lead-machine-run.sh 2>&1
            else
              bash scripts/oracle-resilience/deploy-product.sh 2>&1
            fi
            RC=$?
            echo "--- deploy script exit code: $RC ---"
            exit $RC
